<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hediye Başvuru Formu</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff8e7,#ffe8c7);
  color:#172033;padding:20px;
}
.container{max-width:600px;margin:auto}
.header{text-align:center;padding:25px 10px}
.gift{font-size:64px}
h1{font-size:34px;margin:8px 0}
.subtitle{font-size:18px;color:#666}
.form-box{
  background:#fff;border-radius:22px;padding:24px;
  box-shadow:0 8px 30px rgba(0,0,0,.10)
}
label{display:block;font-weight:bold;margin:16px 0 7px}
input[type=text],input[type=tel],textarea{
  width:100%;padding:17px;border:1px solid #ccc;border-radius:14px;
  font-size:17px;outline:none
}
textarea{min-height:110px;resize:vertical}
.choice{
  display:flex;align-items:center;gap:12px;
  border:1px solid #ddd;border-radius:15px;padding:17px;
  margin:10px 0;cursor:pointer
}
.choice input{width:20px;height:20px}
.shipping{
  display:flex;align-items:center;gap:10px;
  margin:20px 0;font-weight:bold
}
.shipping input{width:20px;height:20px}
.iban{
  background:#f5f5f5;border-radius:14px;padding:15px;
  margin-top:20px
}
.iban-row{display:flex;gap:8px;margin-top:8px}
.iban input{flex:1}
.copy{
  border:0;border-radius:10px;padding:0 15px;
  background:#172033;color:white;font-weight:bold
}
button[type=submit]{
  width:100%;border:0;border-radius:15px;padding:18px;
  background:#e53935;color:#fff;font-size:18px;font-weight:bold;
  cursor:pointer;margin-top:10px
}
.note{text-align:center;color:#777;font-size:13px;margin-top:18px}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <div class="gift">🎁</div>
    <h1>Hediye Başvuru Formu</h1>
    <div class="subtitle">Bilgilerinizi doldurun ve hediyenizi seçin.</div>
  </div>

  <div class="form-box">
    <form action="https://formspree.io/f/mdenyyja" method="POST">

      <input type="hidden" name="_subject" value="Yeni Hediye Başvurusu">

      <label for="name">İsim Soyisim</label>
      <input id="name" name="isim_soyisim" type="text"
             placeholder="Adınız ve soyadınız" required>

      <label for="address">Adres</label>
      <textarea id="address" name="adres"
                placeholder="Teslimat adresiniz" required></textarea>

      <label for="phone">İletişim Telefonu</label>
      <input id="phone" name="telefon" type="tel"
             placeholder="05XX XXX XX XX" required>

      <label>🎁 Seçtiğiniz Hediye</label>

      <label class="choice">
        <input type="radio" name="hediye" value="Anahtarlık" required>
        🔑 Anahtarlık
      </label>

      <label class="choice">
        <input type="radio" name="hediye" value="Cep Parfümü">
        🌸 Cep Parfümü
      </label>

      <label class="choice">
        <input type="radio" name="hediye" value="Kupa">
        ☕ Kupa
      </label>

      <label class="shipping">
        <input type="checkbox" name="kargo" value="Ücretsiz Kargo" required>
        🚚 Ücretsiz Kargo
      </label>

      <div class="iban">
        <strong>💳 IBAN 1</strong>
        <div class="iban-row">
          <input id="iban1" type="text"
                 value="TR380006701000000026441420" readonly>
          <button class="copy" type="button"
                  onclick="navigator.clipboard.writeText(document.getElementById('iban1').value)">
            Kopyala
          </button>
        </div>

        <strong style="display:block;margin-top:16px">💳 IBAN 2</strong>
        <div class="iban-row">
          <input id="iban2" type="text"
                 value="TR750004600563888000200724" readonly>
          <button class="copy" type="button"
                  onclick="navigator.clipboard.writeText(document.getElementById('iban2').value)">
            Kopyala
          </button>
        </div>
      </div>

      <button type="submit">📩 FORMU GÖNDER</button>

      <div class="note">
        Form gönderildiğinde Formspree üzerinden kayıt edilir.
      </div>
    </form>
  </div>
</div>
</body>
</html>
